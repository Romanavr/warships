; 1 = Godot's built-in ad-hoc signer. Not 0.
;
; At 0 the export leaves the export template's own signature in place: the
; binary it was copied from was signed as godot.macos.template_release.arm64,
; and inserting the project pack invalidates that signature without replacing
; it. macOS reports an invalid signature as "is damaged and can't be opened",
; which sends people to the Trash rather than to Privacy & Security and looks
; like a corrupt download rather than a signing problem.
;
; Ad-hoc is not notarisation and does not remove the unidentified-developer
; prompt. It makes the signature valid, which is what stops the false damage
; report. Real signing needs an Apple Developer certificate in `identity`.
;
; Note this file is a ConfigFile: comments start with ';'. A '#' comment parses
; as an identifier and breaks the whole preset.
codesign/codesign=1
codesign/identity=""
codesign/entitlements/allow_jit_code_execution=false
codesign/entitlements/allow_unsigned_executable_memory=false
codesign/entitlements/allow_dyld_environment_variables=false
codesign/entitlements/disable_library_validation=true
notarization/notarization=0
privacy/microphone_usage_description=""
privacy/camera_usage_description=""
ssh_remote_deploy/enabled=false

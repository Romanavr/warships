# Example server block for the web build. Replace example.com and the root.
server {
    server_name example.com;

    root /var/www/littoral/html;
    index index.html;

    # Cross-origin isolation. Both are required for SharedArrayBuffer, which the
    # threaded Godot export needs to start at all. `always` matters: without it
    # nginx omits them on redirects and error responses.
    add_header Cross-Origin-Opener-Policy   "same-origin"   always;
    add_header Cross-Origin-Embedder-Policy "require-corp"  always;

    # NOTE: the `types { application/wasm wasm; }` block that was here has been
    # removed on purpose. In nginx `types` REPLACES the inherited map rather than
    # adding to it, so declaring it here discarded the whole `include mime.types`
    # from the http block — every .html, .js and .png on the site lost its
    # Content-Type. nginx has mapped application/wasm in mime.types since 1.21,
    # so nothing was gained for it either.

    # 37 MB of wasm compresses to about 10 MB.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    # text/html is deliberately absent: nginx always gzips it, and listing it
    # here produces a `duplicate MIME type "text/html"` warning on every reload.
    gzip_types application/wasm application/javascript application/json text/css;

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = example.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name example.com;
    return 404; # managed by Certbot
}

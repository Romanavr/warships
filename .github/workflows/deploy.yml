name: Build and deploy the web build

# Manual, or on a push to main that touches something the build depends on.
# Documentation and the desktop presets do not warrant a five-minute job.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "scenes/**"
      - "ships/**"
      - "assets/**"
      - "tools/build_web.py"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/deploy.yml"

env:
  GODOT_VERSION: 4.7.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The engine and the export templates are ~1.3 GB together and neither
      # changes between runs, so they are cached on the engine version.
      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot "$HOME/.local/share/godot/export_templates"
          curl -fL --retry 3 -o /tmp/godot.zip \
            "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -fL --retry 3 -o /tmp/templates.tpz \
            "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpz
          mv /tmp/tpz/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Put Godot on the path
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      # Godot needs one pass to build its import cache before anything that
      # reads a resource will work, and the exporter reads all of them.
      - name: Import resources
        run: godot --headless --import || true

      - name: Run the tests
        run: |
          set -uo pipefail
          failed=0
          for t in smoke missiles defense air_defense combined player breakup \
                   capture_cargo capture_comms campaign capture_hud capture_lights \
                   capture_debrief masking escort capture_menu lang boot; do
            out=$(godot --headless --script "tests/$t.gd" 2>&1) || true
            if echo "$out" | grep -qE "^FAIL|SCRIPT ERROR|WATCHDOG"; then
              echo "::error title=$t::$(echo "$out" | grep -E '^FAIL|SCRIPT ERROR|WATCHDOG' | head -3)"
              failed=1
            else
              echo "ok  $t"
            fi
          done
          exit $failed

      # Renames every engine-derived file with a hash of the build, so a browser
      # or CDN holding an old copy asks for a URL that no longer exists rather
      # than serving it.
      - name: Build the web export
        run: python3 tools/build_web.py

      - name: Deploy over SSH
        uses: burnett01/rsync-deployments@7.0.2
        with:
          # --delete is what actually retires the previous build's hashed files.
          # Without it the web root grows by a full build every deploy.
          switches: -avzr --delete --exclude=serve.py --exclude=nginx*.conf* --exclude=vercel.json --exclude=*.import
          path: build/web/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      # index.html is the one file whose name never changes, so it is the one
      # that can go stale. Everything else is content-addressed and safe to keep.
      - name: Purge the Cloudflare cache
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | head -c 400
          echo

      - name: Check it is actually serving
        run: |
          set -euo pipefail
          url="${{ secrets.SITE_URL }}"
          headers=$(curl -fsS -I "$url" | tr -d '\r')
          echo "$headers"
          echo "$headers" | grep -qi "^content-type: text/html" \
            || { echo "::error::index.html is not being served as text/html"; exit 1; }
          echo "$headers" | grep -qi "^cross-origin-opener-policy: same-origin" \
            || { echo "::error::COOP header missing — the game will not start"; exit 1; }
          echo "$headers" | grep -qi "^cross-origin-embedder-policy: require-corp" \
            || { echo "::error::COEP header missing — the game will not start"; exit 1; }
          echo "serving correctly"
